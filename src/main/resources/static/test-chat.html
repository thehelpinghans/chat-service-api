<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WebSocket 채팅 테스트</title>
    <style>
        body { font-family: monospace; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h2 { font-size: 16px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: #555; }
        input, textarea, select { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 10px; font-family: monospace; font-size: 12px; }
        button { padding: 6px 16px; cursor: pointer; font-size: 12px; }
        #status { font-size: 12px; padding: 6px; margin-bottom: 10px; background: #f0f0f0; }
        #status.connected { background: #d4edda; color: #155724; }
        #status.disconnected { background: #f8d7da; color: #721c24; }
        #log { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; font-size: 12px; background: #fafafa; }
        .log-recv { color: #155724; }
        .log-send { color: #004085; }
        .log-error { color: #721c24; }
        .log-info { color: #555; }
        hr { border: none; border-top: 1px solid #eee; margin: 16px 0; }
    </style>
</head>
<body>

<h2>WebSocket 채팅 테스트</h2>

<div id="status" class="disconnected">연결 안됨</div>

<hr>

<h2>0. 채팅방 생성 (세션 토큰 받기)</h2>
<label>API Key (X-Api-Key 헤더 — 개발용 더미: test-api-key-0000000000001)</label>
<input id="apiKey" type="text" value="test-api-key-0000000000001">
<label>externalUserId (구매자 외부 ID)</label>
<input id="externalUserId" type="text" value="user-001">
<label>externalItemId (상품 외부 ID)</label>
<input id="externalItemId" type="text" value="item-001">
<label>itemName (상품명)</label>
<input id="itemName" type="text" value="테스트 상품">
<label>itemPrice (상품 가격)</label>
<input id="itemPrice" type="number" value="10000">
<button onclick="createRoom()">채팅방 생성 + 토큰 받기</button>

<hr>

<h2>1. 연결</h2>
<label>JWT 토큰 (채팅방 생성 API 응답의 sessionToken — 위에서 자동 입력됨)</label>
<textarea id="token" rows="3" placeholder="eyJhbGci..."></textarea>
<label>채팅방 ID</label>
<input id="chatRoomId" type="number" value="">
<button onclick="connect()">연결</button>
<button onclick="disconnect()">연결 해제</button>

<hr>

<h2>2. 메시지 전송</h2>
<label>내용</label>
<input id="content" type="text" placeholder="메시지 입력">
<label>타입</label>
<select id="messageType">
    <option value="TEXT">TEXT</option>
    <option value="PAYMENT_REQUEST">PAYMENT_REQUEST</option>
</select>
<button onclick="sendMessage()">전송</button>

<hr>

<h2>3. 수신 로그</h2>
<button onclick="clearLog()">로그 지우기</button>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.js"></script>
<script>
    let client = null;

    async function createRoom() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const externalUserId = document.getElementById('externalUserId').value.trim();
        const externalItemId = document.getElementById('externalItemId').value.trim();
        const itemName = document.getElementById('itemName').value.trim();
        const itemPrice = document.getElementById('itemPrice').value.trim();

        if (!apiKey || !externalUserId || !externalItemId || !itemName || !itemPrice) {
            alert('모든 필드를 입력하세요.');
            return;
        }

        log('POST /api/v1/chat-rooms 요청 중...', 'info');
        try {
            const res = await fetch('/api/v1/chat-rooms', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Api-Key': apiKey
                },
                body: JSON.stringify({ externalUserId, externalItemId, itemName, itemPrice: Number(itemPrice) })
            });

            if (!res.ok) {
                const text = await res.text();
                log('API 오류 ' + res.status + ': ' + text, 'error');
                return;
            }

            const data = await res.json();
            document.getElementById('token').value = data.sessionToken;
            document.getElementById('chatRoomId').value = data.chatRoomId;
            log('채팅방 생성 완료 — chatRoomId: ' + data.chatRoomId + ' / 토큰 자동 입력됨', 'info');
        } catch (e) {
            log('fetch 실패 (서버가 실행 중인지 확인): ' + e.message, 'error');
        }
    }

    function log(msg, type = 'info') {
        const div = document.getElementById('log');
        const line = document.createElement('div');
        line.className = 'log-' + type;
        line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
        div.appendChild(line);
        div.scrollTop = div.scrollHeight;
    }

    function setStatus(msg, connected) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = connected ? 'connected' : 'disconnected';
    }

    function connect() {
        const token = document.getElementById('token').value.trim();
        const chatRoomId = document.getElementById('chatRoomId').value;

        if (!token) { alert('토큰을 입력하세요.'); return; }

        client = new StompJs.Client({
            brokerURL: 'ws://localhost:8080/ws',
            connectHeaders: { Authorization: 'Bearer ' + token },
            onConnect: () => {
                setStatus('연결됨 (chatRoomId: ' + chatRoomId + ')', true);
                log('CONNECT 성공', 'info');

                // 채팅방 구독
                client.subscribe('/topic/chat/' + chatRoomId, (message) => {
                    log('수신: ' + message.body, 'recv');
                });
                log('/topic/chat/' + chatRoomId + ' 구독 완료', 'info');
            },
            onDisconnect: () => {
                setStatus('연결 해제됨', false);
                log('DISCONNECT', 'info');
            },
            onStompError: (frame) => {
                setStatus('에러: ' + frame.headers['message'], false);
                log('STOMP 에러: ' + JSON.stringify(frame.headers), 'error');
            },
            onWebSocketError: (event) => {
                setStatus('WebSocket 에러', false);
                log('WebSocket 에러 (서버가 실행 중인지 확인)', 'error');
            }
        });

        client.activate();
    }

    function disconnect() {
        if (client) { client.deactivate(); client = null; }
    }

    async function sendMessage() {
        const token = document.getElementById('token').value.trim();
        const chatRoomId = document.getElementById('chatRoomId').value;
        const content = document.getElementById('content').value.trim();
        const messageType = document.getElementById('messageType').value;

        if (!token) { alert('토큰을 입력하세요.'); return; }
        if (!content) { alert('내용을 입력하세요.'); return; }

        const body = JSON.stringify({ content, messageType });
        try {
            const res = await fetch('/api/v1/chat-rooms/' + chatRoomId + '/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body
            });

            if (!res.ok) {
                const text = await res.text();
                log('전송 실패 ' + res.status + ': ' + text, 'error');
                return;
            }

            log('전송: ' + body, 'send');
            document.getElementById('content').value = '';
        } catch (e) {
            log('전송 fetch 실패: ' + e.message, 'error');
        }
    }

    function clearLog() {
        document.getElementById('log').innerHTML = '';
    }

    // Enter 키로 메시지 전송
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && document.activeElement.id === 'content') sendMessage();
    });
</script>
</body>
</html>
